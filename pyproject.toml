[project]
name = "langchain-rag-tutorial"
version = "0.3.0"
description = "Hands-on RAG tutorial comparing OpenAI and HuggingFace embeddings, with optional Ollama answers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0,<2",
    "langchain-core>=0.3.0,<2",
    "langchain-text-splitters>=0.3.0,<2",
    "langchain-openai>=0.2.0,<2",
    "langchain-huggingface>=0.1.0,<2",
    "langchain-ollama>=0.2.0,<2",
    "langchain-chroma>=0.1.2,<2",
    "chromadb>=0.5.0,<2",
    "sentence-transformers>=3.0.0,<6",
    "openai>=1.40.0,<4",
    "tiktoken>=0.7.0,<1",
    "requests>=2.32.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
rag-download-kb = "rag.cli:download_kb"
rag-ingest = "rag.cli:ingest"
rag-query = "rag.cli:query"
rag-compare = "rag.cli:compare"
rag-evaluate = "rag.cli:evaluate"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
